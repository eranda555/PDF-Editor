services:
  gateway:
    build:
      context: ..
      dockerfile: backend-cloudrun/Dockerfile
    env_file: ../.env
    ports: ["127.0.0.1:8080:8080"]
    read_only: true
    tmpfs: ["/tmp:size=536870912,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 1g
    cpus: 1
  queue:
    build:
      context: ..
      dockerfile: backend-cloudrun/Dockerfile
    env_file: ../.env
    command: ["python", "-m", "app.queue.procrastinate_app"]
    read_only: true
    tmpfs: ["/tmp:size=536870912,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 1g
    cpus: 1
  heavy:
    build:
      context: ..
      dockerfile: worker-hf-space/Dockerfile
    env_file: ../.env
    ports: ["127.0.0.1:7860:7860"]
    read_only: true
    tmpfs: ["/tmp:size=2147483648,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 4g
    cpus: 2
